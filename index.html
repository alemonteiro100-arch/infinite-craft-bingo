<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinite Craft X1 — Bingo 4x4</title>
<style>
:root{--bg:#0f1117;--panel:#171a23;--panel2:#202532;--text:#f4f6fb;--muted:#9da6b8;--line:#303746;--accent:#7c5cff;--p1:#4da3ff;--p2:#ff5d8f;--p3:#48d597;--p4:#ffb347}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0c0e14,#151927);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:24px 16px 48px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:clamp(24px,5vw,38px);margin:0}.sub{color:var(--muted);margin-top:6px}.panel{background:rgba(23,26,35,.94);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;margin-bottom:6px;color:var(--muted);font-size:13px}input,button{font:inherit}input{width:100%;background:#0e1118;border:1px solid var(--line);color:var(--text);padding:13px 14px;border-radius:11px;outline:none}input:focus{border-color:var(--accent)}button{border:0;border-radius:11px;padding:12px 16px;background:var(--accent);color:white;font-weight:700;cursor:pointer;min-height:44px}button.secondary{background:var(--panel2);border:1px solid var(--line)}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.status{margin-top:12px;color:var(--muted);min-height:22px}.code{font-family:ui-monospace,monospace;font-size:22px;letter-spacing:3px;background:#0c0f15;padding:9px 12px;border-radius:9px}.hidden{display:none!important}.room{display:flex;gap:10px;align-items:end}.score{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.player{text-align:center;padding:10px 6px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);min-width:0}.player strong{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.scoreNum{font-size:22px;font-weight:800}.p1{border-color:var(--p1)}.p2{border-color:var(--p2)}.p3{border-color:var(--p3)}.p4{border-color:var(--p4)}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:18px}.cell{min-height:120px;background:#202532;border:1px solid #343c4d;border-radius:12px;padding:9px;display:flex;align-items:center;justify-content:center;text-align:center;color:#eef1f7;font-weight:750;line-height:1.15;position:relative;overflow:hidden}.cell:not(.claimed){cursor:pointer}.cell:not(.claimed):hover{border-color:var(--accent);background:#282e3d}.cell.claimed{cursor:not-allowed}.cell.p1{background:rgba(77,163,255,.22);border-color:var(--p1)}.cell.p2{background:rgba(255,93,143,.22);border-color:var(--p2)}.cell.p3{background:rgba(72,213,151,.22);border-color:var(--p3)}.cell.p4{background:rgba(255,179,71,.22);border-color:var(--p4)}.badge{position:absolute;left:5px;right:5px;bottom:5px;font-size:10px;text-transform:uppercase;letter-spacing:.4px;opacity:.9}.win{outline:2px solid #48d597;box-shadow:0 0 0 3px rgba(72,213,151,.12)}.legend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222838;border:1px solid var(--line);padding:12px 16px;border-radius:12px;display:none;z-index:5;max-width:90%}@media(max-width:620px){.grid2{grid-template-columns:1fr}.board{gap:5px}.cell{min-height:88px;font-size:12px;padding:6px}.wrap{padding:18px 10px 36px}.score{gap:5px}.player strong{font-size:12px}.scoreNum{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><h1>⚗️ Infinite Craft X1</h1><div class="sub">Bingo 4×4 • até 4 jogadores • tempo real</div></div><div id="roomBadge" class="code hidden"></div></div>

<section id="setup" class="panel">
<h2>Nova partida</h2>
<div class="grid2">
<div><label>Seu nome</label><input id="name" maxlength="24" placeholder="Ex.: Alexandre"></div>
<div><label>Código da sala</label><input id="room" maxlength="8" placeholder="Para entrar em uma sala" style="text-transform:uppercase"></div>
</div>
<div class="actions"><button id="create">Criar nova sala</button><button id="join" class="secondary">Entrar em uma sala</button></div>
<div class="status" id="setupStatus">Ao criar uma sala, você recebe um código para compartilhar.</div>
</section>

<section id="game" class="hidden">
<div class="panel">
<div class="top"><div><b>Sala</b> <span id="roomText" class="code"></span><div class="sub" id="roundInfo"></div></div><button id="newRound" class="secondary">Nova rodada</button></div>
<div class="score" id="score"></div>
<div class="legend">
<span><i class="dot" style="background:var(--p1)"></i>Jogador 1</span>
<span><i class="dot" style="background:var(--p2)"></i>Jogador 2</span>
<span><i class="dot" style="background:var(--p3)"></i>Jogador 3</span>
<span><i class="dot" style="background:var(--p4)"></i>Jogador 4</span>
</div>
<div id="board" class="board"></div>
<div class="status" id="gameStatus" aria-live="polite"></div>
</div>
</section>
</div>
<div id="toast" class="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://lkrolnmyxjgzcgvlnhcl.supabase.co','sb_publishable_Yc5uqRfGtZhha53YgsjuEQ_EdOe_Ik_');
const COLORS=['p1','p2','p3','p4'];

const BOARDS=[
["Pizza","Dinossauro","Robô","Vampiro","Arco-íris","Oceano","Vulcão","Castelo","Sereia","Zumbi","Lua","Dragão","Unicórnio","Alienígena","Foguete","Super-herói"],
["Pizza","Fantasma","Dinossauro","Mago","Vampiro","Robô","Arco-íris","Pirata","Dragão","Castelo","Sereia","Zumbi","Alienígena","Foguete","Lua","Unicórnio"],
["Dinossauro","Pizza","Vampiro","Dragão","Robô","Oceano","Fantasma","Castelo","Mago","Arco-íris","Zumbi","Foguete","Sereia","Alienígena","Unicórnio","Lua"],
["Robô","Dinossauro","Pizza","Alienígena","Castelo","Dragão","Vampiro","Lua","Zumbi","Sereia","Arco-íris","Foguete","Mago","Fantasma","Unicórnio","Oceano"],
["Vampiro","Robô","Dragão","Pizza","Lua","Dinossauro","Castelo","Alienígena","Fantasma","Oceano","Zumbi","Unicórnio","Foguete","Sereia","Mago","Arco-íris"],
["Arco-íris","Pizza","Sereia","Dinossauro","Foguete","Vampiro","Robô","Fantasma","Oceano","Dragão","Lua","Zumbi","Castelo","Alienígena","Unicórnio","Mago"],
["Alienígena","Dragão","Pizza","Robô","Unicórnio","Castelo","Dinossauro","Vampiro","Foguete","Lua","Mago","Sereia","Fantasma","Oceano","Zumbi","Arco-íris"],
["Fantasma","Vampiro","Dinossauro","Pizza","Oceano","Robô","Dragão","Foguete","Arco-íris","Castelo","Unicórnio","Alienígena","Lua","Mago","Sereia","Zumbi"],
["Castelo","Pizza","Foguete","Dinossauro","Dragão","Sereia","Robô","Lua","Vampiro","Arco-íris","Alienígena","Zumbi","Mago","Unicórnio","Fantasma","Oceano"],
["Oceano","Robô","Pizza","Vampiro","Dinossauro","Lua","Castelo","Foguete","Sereia","Dragão","Fantasma","Alienígena","Arco-íris","Zumbi","Mago","Unicórnio"],
["Mago","Dinossauro","Alienígena","Pizza","Robô","Unicórnio","Vampiro","Oceano","Dragão","Castelo","Lua","Foguete","Sereia","Fantasma","Arco-íris","Zumbi"],
["Foguete","Pizza","Zumbi","Dragão","Dinossauro","Fantasma","Castelo","Robô","Alienígena","Vampiro","Arco-íris","Lua","Unicórnio","Sereia","Oceano","Mago"]
];

let game=null,claims=[],myPlayer=null,channel=null;
const $=id=>document.getElementById(id);
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>t.style.display='none',2400)};
const makeCode=()=>Math.random().toString(36).slice(2,7).toUpperCase();
const boardForRound=r=>BOARDS[(r-1)%BOARDS.length];

function winners(list){
 const s=new Set(list.map(x=>x.cell_index)), lines=[];
 for(let r=0;r<4;r++) lines.push([0,1,2,3].map(c=>r*4+c));
 for(let c=0;c<4;c++) lines.push([0,1,2,3].map(r=>r*4+c));
 lines.push([0,5,10,15],[3,6,9,12]);
 return lines.filter(line=>line.every(i=>s.has(i)));
}
function players(){return [game.player1_name,game.player2_name,game.player3_name,game.player4_name]}
function render(){
 if(!game)return;
 $('roomText').textContent=game.room_code;$('roomBadge').textContent=game.room_code;$('roundInfo').textContent=`Rodada ${game.round} de 10`;
 const names=players(), score=$('score');score.innerHTML='';
 names.forEach((n,i)=>{if(!n)return;const box=document.createElement('div');box.className=`player ${COLORS[i]}`;box.innerHTML=`<strong>${esc(n)}</strong><span class="scoreNum">${claims.filter(c=>c.player_slot===i+1).length}</span>`;score.appendChild(box)});
 const myWins=winners(claims.filter(c=>c.player_slot===myPlayer));const winCells=new Set(myWins.flat());
 const board=boardForRound(game.round);$('board').innerHTML='';
 board.forEach((word,i)=>{
   const b=document.createElement('button');b.type='button';b.className='cell';b.textContent=word;
   const cl=claims.find(c=>c.cell_index===i);
   if(cl){b.classList.add('claimed',COLORS[cl.player_slot-1]);const badge=document.createElement('span');badge.className='badge';badge.textContent=names[cl.player_slot-1]||`Jogador ${cl.player_slot}`;b.appendChild(badge);b.disabled=true}
   else b.addEventListener('click',()=>claim(i));
   if(winCells.has(i))b.classList.add('win');
   $('board').appendChild(b);
 });
 $('newRound').disabled=myPlayer!==1;
 $('gameStatus').textContent=!game.player2_name?'Aguardando outros jogadores entrarem…':(myWins.length?'🏆 Você fechou um Bingo!':'Clique em uma palavra quando conseguir criá-la no Infinite Craft.');
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

async function claim(i){
 if(claims.some(c=>c.cell_index===i))return;
 const name=players()[myPlayer-1];
 const {error}=await supabase.from('claims').insert({game_id:game.id,cell_index:i,player_name:name,player_slot:myPlayer});
 if(error)toast(error.code==='23505'?'Essa palavra já foi conquistada.':error.message);
}
async function loadClaims(){const {data,error}=await supabase.from('claims').select('*').eq('game_id',game.id).order('claimed_at');if(error)return toast(error.message);claims=data||[];render()}
function subscribe(){
 channel=supabase.channel('game-'+game.id)
 .on('postgres_changes',{event:'*',schema:'public',table:'claims',filter:'game_id=eq.'+game.id},()=>loadClaims())
 .on('postgres_changes',{event:'UPDATE',schema:'public',table:'games',filter:'id=eq.'+game.id},p=>{game=p.new;loadClaims()})
 .subscribe();
}
async function createGame(){
 const name=$('name').value.trim();if(!name)return toast('Digite seu nome.');
 const room=makeCode();const {data,error}=await supabase.from('games').insert({room_code:room,round:1,player1_name:name}).select().single();
 if(error)return toast(error.message);game=data;myPlayer=1;enterGame();
}
async function joinGame(){
 const name=$('name').value.trim(),room=$('room').value.trim().toUpperCase();if(!name||!room)return toast('Digite seu nome e o código.');
 const {data,error}=await supabase.from('games').select('*').eq('room_code',room).maybeSingle();
 if(error||!data)return toast('Sala não encontrada.');
 const names=playersFor(data), slot=names.findIndex(x=>!x)+1;
 if(!slot||slot>4)return toast('Essa sala já tem 4 jogadores.');
 const field=`player${slot}_name`, upd={};upd[field]=name;
 const {data:updated,error:e}=await supabase.from('games').update(upd).eq('id',data.id).is(field,null).select().single();
 if(e||!updated)return toast('Essa vaga acabou de ser ocupada. Tente novamente.');
 game=updated;myPlayer=slot;enterGame();
}
function playersFor(g){return [g.player1_name,g.player2_name,g.player3_name,g.player4_name]}
function enterGame(){$('setup').classList.add('hidden');$('game').classList.remove('hidden');$('roomBadge').classList.remove('hidden');subscribe();loadClaims();render()}
async function newRound(){
 if(myPlayer!==1)return;
 const next=game.round>=10?1:game.round+1;
 await supabase.from('claims').delete().eq('game_id',game.id);
 const {data,error}=await supabase.from('games').update({round:next}).eq('id',game.id).select().single();
 if(error)return toast(error.message);game=data;claims=[];render();toast(`Rodada ${next} começou!`);
}
$('create').addEventListener('click',createGame);$('join').addEventListener('click',joinGame);$('newRound').addEventListener('click',newRound);$('room').addEventListener('input',e=>e.target.value=e.target.value.toUpperCase());
</script>
</body>
</html>
