<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infinite Craft X1 — Bingo</title>
  <style>
    :root{--bg:#0f1117;--panel:#171a23;--panel2:#202532;--text:#f4f6fb;--muted:#9da6b8;--line:#303746;--accent:#7c5cff;--p1:#4da3ff;--p2:#ff5d8f;--ok:#48d597}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#0c0e14,#151927);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
    .wrap{max-width:900px;margin:auto;padding:24px 16px 48px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
    h1{font-size:clamp(24px,5vw,38px);margin:0}.sub{color:var(--muted);margin-top:6px}.panel{background:rgba(23,26,35,.94);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:18px}
    input,button{font:inherit} input{width:100%;background:#0e1118;border:1px solid var(--line);color:var(--text);padding:13px 14px;border-radius:11px;outline:none}
    input:focus{border-color:var(--accent)} button{border:0;border-radius:11px;padding:12px 16px;background:var(--accent);color:white;font-weight:700;cursor:pointer;min-height:44px}
    button.secondary{background:var(--panel2);border:1px solid var(--line)} button:disabled{opacity:.45;cursor:not-allowed}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.room{display:flex;gap:10px;align-items:end}.room>div{flex:1}
    .hidden{display:none!important}.status{margin-top:12px;color:var(--muted);min-height:22px}.code{font-family:ui-monospace,monospace;font-size:22px;letter-spacing:3px;background:#0c0f15;padding:9px 12px;border-radius:9px}
    .score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:16px}.player{text-align:center;padding:12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}
    .player.p1{border-color:var(--p1)}.player.p2{border-color:var(--p2)}.player strong{display:block;font-size:20px}.scoreNum{font-size:25px;font-weight:800}.round{text-align:center;color:var(--muted);font-weight:700}
    .board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px}.cell{min-height:100px;background:#202532;border:1px solid #343c4d;border-radius:12px;padding:9px;display:flex;align-items:center;justify-content:center;text-align:center;color:#eef1f7;font-weight:700;line-height:1.15;position:relative;overflow:hidden}
    .cell:not(.claimed):not(.free){cursor:pointer}.cell:not(.claimed):not(.free):hover{border-color:var(--accent);background:#282e3d}.cell.free{background:#282c36;color:#b8bfcc}
    .cell.claimed{cursor:not-allowed}.cell.p1{background:rgba(77,163,255,.22);border-color:var(--p1)}.cell.p2{background:rgba(255,93,143,.22);border-color:var(--p2)}
    .badge{position:absolute;left:6px;right:6px;bottom:5px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;opacity:.9}.win{outline:2px solid var(--ok);box-shadow:0 0 0 3px rgba(72,213,151,.12)}
    .legend{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.blue{background:var(--p1)}.pink{background:var(--p2)}
    .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222838;border:1px solid var(--line);padding:12px 16px;border-radius:12px;display:none;z-index:5}
    @media(max-width:620px){.grid2{grid-template-columns:1fr}.board{gap:5px}.cell{min-height:82px;font-size:12px;padding:6px}.wrap{padding:18px 10px 36px}.score{grid-template-columns:1fr 50px 1fr}.player strong{font-size:16px}}
  </style>
</head>
<body>
<div class="wrap" id="app">
  <div class="top"><div><h1>⚗️ Infinite Craft X1</h1><div class="sub">Bingo competitivo em tempo real</div></div><div id="roomBadge" class="code hidden"></div></div>

  <section id="setup" class="panel">
    <h2>Entrar na partida</h2>
    <div class="grid2">
      <div><label>Seu nome</label><input id="name" maxlength="24" placeholder="Ex.: Alexandre"></div>
      <div><label>Código da sala</label><input id="room" maxlength="8" placeholder="Ex.: X7K92" style="text-transform:uppercase"></div>
    </div>
    <div class="actions">
      <button id="create">Criar nova sala</button>
      <button id="join" class="secondary">Entrar em uma sala</button>
    </div>
    <div class="status" id="setupStatus"></div>
  </section>

  <section id="game" class="hidden">
    <div class="panel">
      <div class="top">
        <div><b>Sala</b> <span id="roomText" class="code"></span><div class="sub" id="roundInfo"></div></div>
        <button id="newRound" class="secondary">Nova rodada</button>
      </div>
      <div class="score">
        <div class="player p1"><strong id="p1name">Aguardando…</strong><span class="scoreNum" id="p1score">0</span></div>
        <div class="round">×</div>
        <div class="player p2"><strong id="p2name">Aguardando…</strong><span class="scoreNum" id="p2score">0</span></div>
      </div>
      <div class="legend"><span><i class="dot blue"></i>Jogador 1</span><span><i class="dot pink"></i>Jogador 2</span><span>🟢 Bingo</span></div>
      <div id="board" class="board"></div>
      <div class="status" id="gameStatus" aria-live="polite"></div>
    </div>
  </section>
</div>
<div id="toast" class="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://lkrolnmyxjgzcgvlnhcl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Yc5uqRfGtZhha53YgsjuEQ_EdOe_Ik_';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const BOARDS = [
["Buraco Negro","Cthulhu","Mona Lisa","Apocalipse","Dinossauro Robô","Multiverso","Quasar","Jurassic Park","Deus Grego","Máquina do Tempo","Sherlock Holmes","Dragão Cósmico","LIVRE","Pokémon","Buraco de Minhoca","Universo Paralelo","Frankenstein","Viagem no Tempo","Alienígena Supremo","Civilização Alienígena","Deus da Morte","Inteligência Artificial","Império Galáctico","Apocalipse Zumbi","Singularidade"],
["Antimatéria","Atlântida","Godzilla","Buraco de Minhoca","Matrix","TARDIS","Vampiro Espacial","Dinossauro Alienígena","Multiverso","Robô Gigante","Cleópatra","Excalibur","LIVRE","Ninja","Universo Paralelo","Supernova","Cavaleiro Jedi","Kraken","Máquina do Tempo","Civilização Perdida","Deus Nórdico","Apocalipse Nuclear","Inteligência Artificial","Planeta Habitável","Viagem Interdimensional"],
["Viagem no Tempo","Quasar","Frankenstein","Jurassic Park","Alienígena","Dragão Cósmico","Mona Lisa","Singularidade","Império Galáctico","Cthulhu","Buraco Negro","Robô Gigante","LIVRE","Atlântida","Apocalipse Zumbi","Sherlock Holmes","Pokémon Lendário","Antimatéria","Máquina do Tempo","Deus Grego","Civilização Alienígena","Universo Paralelo","Supernova","Deus da Morte","Matrix"],
["Kraken","Civilização Perdida","Dinossauro Robô","TARDIS","Vampiro Espacial","Excalibur","Godzilla","Quasar","Ninja","Buraco Negro","Apocalipse","LIVRE","Dragão Cósmico","Máquina do Tempo","Atlântida","Cavaleiro Jedi","Mona Lisa","Singularidade","Alienígena Supremo","Antimatéria","Frankenstein","Império Galáctico","Jurassic Park","Deus Nórdico","Universo Paralelo"],
["Supernova","Pokémon Lendário","Matrix","Cthulhu","Planeta Habitável","Sherlock Holmes","Deus da Morte","Buraco de Minhoca","Civilização Alienígena","Dinossauro Alienígena","Atlântida","Apocalipse Nuclear","LIVRE","Robô Gigante","Viagem Interdimensional","Mona Lisa","Kraken","Máquina do Tempo","Antimatéria","Deus Grego","Singularidade","Frankenstein","Godzilla","Império Galáctico","Cavaleiro Jedi"],
["Apocalipse Zumbi","Excalibur","Quasar","Alienígena Supremo","TARDIS","Mona Lisa","Supernova","Deus Nórdico","Matrix","Buraco Negro","Jurassic Park","Inteligência Artificial","LIVRE","Civilização Perdida","Kraken","Dinossauro Robô","Viagem no Tempo","Atlântida","Cthulhu","Planeta Habitável","Sherlock Holmes","Antimatéria","Vampiro Espacial","Universo Paralelo","Máquina do Tempo"],
["Godzilla","Singularidade","Cavaleiro Jedi","Buraco de Minhoca","Frankenstein","Civilização Alienígena","Quasar","Excalibur","Apocalipse","TARDIS","Pokémon Lendário","Deus da Morte","LIVRE","Supernova","Dinossauro Alienígena","Mona Lisa","Matrix","Império Galáctico","Atlântida","Viagem Interdimensional","Cthulhu","Jurassic Park","Antimatéria","Deus Grego","Robô Gigante"],
["Universo Paralelo","Kraken","Sherlock Holmes","Apocalipse Nuclear","Dinossauro Robô","Deus Nórdico","Mona Lisa","Antimatéria","Máquina do Tempo","Alienígena Supremo","Cthulhu","Supernova","LIVRE","Cavaleiro Jedi","Godzilla","Buraco Negro","Excalibur","Civilização Perdida","Quasar","Frankenstein","TARDIS","Planeta Habitável","Império Galáctico","Pokémon Lendário","Singularidade"],
["Deus Grego","Viagem Interdimensional","Matrix","Jurassic Park","Vampiro Espacial","Atlântida","Dinossauro Alienígena","Cthulhu","Buraco de Minhoca","Mona Lisa","Civilização Alienígena","Quasar","LIVRE","Antimatéria","Máquina do Tempo","Godzilla","Sherlock Holmes","Apocalipse Zumbi","Universo Paralelo","Deus da Morte","TARDIS","Supernova","Excalibur","Robô Gigante","Império Galáctico"],
["Inteligência Artificial","Apocalipse","Kraken","Cavaleiro Jedi","Singularidade","Planeta Habitável","Frankenstein","Godzilla","Viagem no Tempo","Deus Nórdico","Quasar","Pokémon Lendário","LIVRE","Buraco Negro","Mona Lisa","TARDIS","Alienígena Supremo","Atlântida","Matrix","Civilização Perdida","Jurassic Park","Antimatéria","Máquina do Tempo","Cthulhu","Dinossauro Robô"]
];

let game=null, claims=[], myPlayer=null, channel=null;

const $=id=>document.getElementById(id);
const toast=(m)=>{const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};
const code=()=>Math.random().toString(36).slice(2,7).toUpperCase();

function boardForRound(round){ return BOARDS[(round-1)%BOARDS.length]; }
function wins(claimsList){
  const s=new Set(claimsList.map(x=>x.cell_index));
  const lines=[];
  for(let r=0;r<5;r++) lines.push([0,1,2,3,4].map(c=>r*5+c));
  for(let c=0;c<5;c++) lines.push([0,1,2,3,4].map(r=>r*5+c));
  lines.push([0,6,12,18,24],[4,8,12,16,20]);
  return lines.filter(line=>line.every(i=>i===12 || s.has(i)));
}
function render(){
  if(!game)return;
  $('roomText').textContent=game.room_code;
  $('roomBadge').textContent=game.room_code;
  $('roundInfo').textContent=`Rodada ${game.round} de 10`;
  $('p1name').textContent=game.player1_name||'Jogador 1';
  $('p2name').textContent=game.player2_name||'Aguardando…';
  const p1=claims.filter(c=>c.player_slot===1).length, p2=claims.filter(c=>c.player_slot===2).length;
  $('p1score').textContent=p1;$('p2score').textContent=p2;
  const board=boardForRound(game.round), winners=wins(claims);
  const wonCells=new Set(winners.flat());
  $('board').innerHTML='';
  board.forEach((word,i)=>{
    const div=document.createElement('button');div.type='button';div.className='cell';
    if(i===12){div.classList.add('free');div.textContent='⭐ LIVRE';div.disabled=true}
    else{
      const cl=claims.find(c=>c.cell_index===i);
      div.textContent=word;
      if(cl){div.classList.add('claimed',cl.player_slot===1?'p1':'p2');const b=document.createElement('span');b.className='badge';b.textContent=cl.player_slot===1?game.player1_name:game.player2_name;div.appendChild(b);div.disabled=true}
      else div.addEventListener('click',()=>claim(i));
    }
    if(wonCells.has(i))div.classList.add('win');
    $('board').appendChild(div);
  });
  const myWin=wins(claims.filter(c=>c.player_slot===myPlayer));
  if(myWin.length) $('gameStatus').textContent=`🏆 ${myPlayer===1?game.player1_name:game.player2_name} fechou um Bingo!`;
  else if(!game.player2_name)$('gameStatus').textContent='Aguardando o segundo jogador entrar…';
  else $('gameStatus').textContent='Clique em uma palavra quando você conseguir criá-la no Infinite Craft.';
}

async function claim(i){
  if(i===12||claims.some(c=>c.cell_index===i)||!game)return;
  const {error}=await supabase.from('claims').insert({game_id:game.id,cell_index:i,player_name:myPlayer===1?game.player1_name:game.player2_name,player_slot:myPlayer});
  if(error){ if(error.code==='23505') toast('Essa palavra já foi conquistada pelo outro jogador.'); else toast(error.message); }
}
async function loadClaims(){
  const {data,error}=await supabase.from('claims').select('*').eq('game_id',game.id).order('claimed_at');
  if(error){toast(error.message);return} claims=data||[];render();
}
function subscribe(){
  channel=supabase.channel('game-'+game.id).on('postgres_changes',{event:'*',schema:'public',table:'claims',filter:'game_id=eq.'+game.id},payload=>loadClaims()).on('postgres_changes',{event:'UPDATE',schema:'public',table:'games',filter:'id=eq.'+game.id},payload=>{game=payload.new;render()}).subscribe();
}
async function startCreate(){
  const name=$('name').value.trim();if(!name){toast('Digite seu nome.');return}
  const room=code();
  const {data,error}=await supabase.from('games').insert({room_code:room,round:1,player1_name:name}).select().single();
  if(error){toast(error.message);return}
  game=data;myPlayer=1;$('setup').classList.add('hidden');$('game').classList.remove('hidden');$('roomBadge').classList.remove('hidden');subscribe();render();
}
async function startJoin(){
  const name=$('name').value.trim(), room=$('room').value.trim().toUpperCase();if(!name||!room){toast('Digite seu nome e o código da sala.');return}
  const {data,error}=await supabase.from('games').select('*').eq('room_code',room).maybeSingle();
  if(error||!data){toast('Sala não encontrada.');return}
  if(data.player2_name){toast('Essa sala já tem dois jogadores.');return}
  const {data:updated,error:e2}=await supabase.from('games').update({player2_name:name}).eq('id',data.id).is('player2_name',null).select().single();
  if(e2||!updated){toast('Outro jogador entrou primeiro.');return}
  game=updated;myPlayer=2;$('setup').classList.add('hidden');$('game').classList.remove('hidden');$('roomBadge').classList.remove('hidden');subscribe();await loadClaims();render();
}
async function newRound(){
  if(!game||myPlayer!==1)return;
  const next=game.round>=10?1:game.round+1;
  await supabase.from('claims').delete().eq('game_id',game.id);
  const {data,error}=await supabase.from('games').update({round:next}).eq('id',game.id).select().single();
  if(error){toast(error.message);return} game=data;claims=[];render();toast(`Rodada ${next} começou!`);
}
$('create').addEventListener('click',startCreate);$('join').addEventListener('click',startJoin);$('newRound').addEventListener('click',newRound);
$('room').addEventListener('input',e=>e.target.value=e.target.value.toUpperCase());
</script>
</body>
</html>
